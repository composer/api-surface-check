name: 'API Surface Check — Preflight'
description: 'Quick scan of a PR diff for tokens that could affect the API surface. Writes a true/false verdict file the comment workflow can use to skip the full analysis early.'
author: 'Composer'
branding:
  icon: 'fast-forward'
  color: 'blue'

inputs:
  base-ref:
    description: 'Git ref to diff against (e.g. origin/main).'
    required: true
  paths:
    description: 'Pathspec patterns to scan (whitespace or newline separated).'
    required: false
    default: 'src/**/*.php'
  output-file:
    description: 'Path to write the verdict file (true/false). The directory is created if missing.'
    required: false
    default: 'api-surface-preflight/preflight.txt'

runs:
  using: 'composite'
  steps:
    - name: Run preflight scan
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        PATHS_GLOB: ${{ inputs.paths }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: bash ${{ github.action_path }}/../scripts/preflight.sh
