name: 'API Surface Check — Post Comment'
description: 'Post / update / delete the PR comment for an API surface analysis result.'
author: 'Composer'
branding:
  icon: 'message-circle'
  color: 'blue'

inputs:
  pr-number:
    description: 'PR number to post / update / delete the comment on.'
    required: true
  output-dir:
    description: 'Directory containing the comment-body.txt produced by the analysis action. An empty or missing body deletes any existing marked comment (used for stale-comment cleanup when analysis is skipped).'
    required: false
    default: 'api-surface-result'
  comment-marker:
    description: 'HTML comment marker used to identify previous bot comments.'
    required: false
    default: '<!-- api-surface-bot -->'

runs:
  using: 'composite'
  steps:
    - name: Post or update API surface comment
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: bash ${{ github.action_path }}/../scripts/post-comment.sh
